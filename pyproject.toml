[build-system]
requires = ["setuptools>=77"]  # PEP 639 license-files support
build-backend = "setuptools.build_meta"

[project]
name = "vtknet"
version = "0.7.0"
description = "Evidence-driven network testing toolkit built on Scapy: packet-in/packet-out pipeline, structured JSON findings with raw-packet proof."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["scapy", "network", "security", "scanning", "packet-crafting", "detection-engineering", "evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = ["scapy>=2.6", "cryptography>=3.4", "typing_extensions>=4.4"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
vtk = "vtknet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
