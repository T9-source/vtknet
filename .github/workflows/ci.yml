name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04   # 3.9 not provisioned on the 24.04 runner image
          - python: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      # SHA-pinned — supply-chain policy: actions are pinned to full commit SHAs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e .
      - name: unit tests (no live traffic — dry-run and pure builders only)
        run: python -m unittest discover -s tests -t . -v
      - name: lint
        run: |
          pip install ruff
          ruff check src tests
